# Traefik dynamic configuration for the live-preview wildcard.
#
# Dokploy's Domains tab only writes `Host()` rules, so the `p{port}-{hash}`
# subdomains need this file. Place it at
#
#   /etc/dokploy/traefik/dynamic/ucch-preview.yml
#
# through Dokploy's "Web Server -> Traefik -> File System" editor. Traefik
# picks it up without a restart. Dokploy never rewrites files it did not
# generate, so it survives redeploys.
#
# Replace the two placeholders:
#   UCCH_ROOT_DOMAIN   e.g. ucch.danialirfan.dev (dots escaped in the rule: ucch\.danialirfan\.dev)
#   UCCH_SERVER_APP    the server application's "App Name" from Dokploy's
#                      General tab, e.g. ucch-server-x1y2z3. It is the
#                      container's DNS name on dokploy-network.
#
# `letsencrypt-dns` is the DNS-01 resolver added in deploy.md step 3;
# HTTP-01 cannot issue `*.` names, so Dokploy's default resolver will not do.

http:
  routers:
    ucch-preview:
      rule: "HostRegexp(`^p[0-9]+-[a-z0-9]{12}\\.UCCH_ROOT_DOMAIN_ESCAPED$`)"
      entryPoints:
        - websecure
      service: ucch-preview
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "UCCH_ROOT_DOMAIN"
            sans:
              - "*.UCCH_ROOT_DOMAIN"

  services:
    ucch-preview:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://UCCH_SERVER_APP:3001"
