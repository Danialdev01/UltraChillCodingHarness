# UCCH as ONE container, for running the production image locally or for
# anyone who prefers Compose to a Dokploy "Dockerfile" application. Both
# build the same `app` target; see README.md, "Deploying on Dokploy".
#
#   docker compose up -d --build        then open http://localhost:3000
#
# Inside the container: the API and WebSocket on :3000 in front of the
# Next.js UI, PostgreSQL 16, and MariaDB when ENABLE_MYSQL=true, all
# supervised by s6-overlay. Everything stateful is under /data.
#
# The only required variable is ROOT_DOMAIN; see .env.example for the rest.

services:
  ucch:
    build:
      context: .
      target: app
      args:
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY:-}
    restart: unless-stopped
    # Never two at once: they would share one Postgres data directory.
    deploy:
      replicas: 1
    # Long enough for the server to drain its workers on a redeploy.
    stop_grace_period: 75s
    ports:
      - "${UCCH_PORT:-3000}:3000"
    # Passed through explicitly rather than with env_file: the repo's .env is
    # the *development* one (DATABASE_URL on the host, DEV_AUTH_BYPASS, ...).
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      # Where the browser reaches the app, when that is not scheme://ROOT_DOMAIN
      # (a local port, say).
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:3000}
      ENABLE_MYSQL: ${ENABLE_MYSQL:-false}
      AGENT_ALLOW_HOST_SHELL: "true"
      DEFAULT_USER_EMAIL: ${UCCH_DEFAULT_USER_EMAIL:-}
      DEFAULT_USER_PASSWORD: ${UCCH_DEFAULT_USER_PASSWORD:-}
      SECRET_KEY: ${UCCH_SECRET_KEY:-}
      GITHUB_CLIENT_ID: ${UCCH_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${UCCH_GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_USERS: ${UCCH_GITHUB_ALLOWED_USERS:-}
      GITHUB_ALLOWED_ORGS: ${UCCH_GITHUB_ALLOWED_ORGS:-}
      ANTHROPIC_API_KEY: ${UCCH_ANTHROPIC_API_KEY:-}
      CRAWL4AI_URL: ${UCCH_CRAWL4AI_URL:-}
    volumes:
      - ucch-data:/data

  # ---------------------------------------------------------------------------
  # Routing it through Traefik instead (as a Dokploy Compose service would):
  # remove `ports` above and add
  #
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.ucch.rule=Host(`${ROOT_DOMAIN}`)
  #     - traefik.http.routers.ucch.entrypoints=websecure
  #     - traefik.http.routers.ucch.tls.certresolver=letsencrypt
  #     - traefik.http.services.ucch.loadbalancer.server.port=3000
  #     # Live previews, p{port}-{hash}.ROOT_DOMAIN, need a wildcard
  #     # certificate (a DNS-01 resolver):
  #     - traefik.http.routers.ucch-preview.rule=HostRegexp(`^p[0-9]+-[a-z0-9]{12}\.${ROOT_DOMAIN}$$`)
  #     - traefik.http.routers.ucch-preview.entrypoints=websecure
  #     - traefik.http.routers.ucch-preview.tls.certresolver=letsencrypt-dns
  #     - traefik.http.routers.ucch-preview.service=ucch
  #   networks: [dokploy-network]

volumes:
  # Everything: the databases, project checkouts, CLI logins, generated
  # secrets, backups. Back it up whole; without secrets/secret_key the stored
  # API keys cannot be read.
  ucch-data:
